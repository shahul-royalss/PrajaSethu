# Praja Setu — Render blueprint (https://render.com).
# In the Render dashboard: New + → Blueprint → pick this repo → Apply.
# Two public services + one Postgres come up; open the web service's URL.
#
# The web service proxies /api to the API service (set via API_PROXY_TARGET below),
# so the browser only ever talks to the web URL — no CORS, one public surface.

# PERSISTENT STORAGE: a managed Postgres, provisioned by this blueprint. The API
# applies the schema and seeds the demo baseline automatically on first boot, and
# data then survives every later redeploy and cold start.
# NOTE: Render allows ONE free Postgres per workspace, and free databases expire
# after 30 days. If the free DB slot is taken (or for anything longer-lived),
# delete the `databases:` block + the fromDatabase reference below and instead
# paste an external connection string (Neon / Supabase free tier, e.g.
# postgresql://USER:PASS@HOST/DB?sslmode=require) into DATABASE_URL in the
# dashboard.
databases:
  - name: praja-setu-db
    plan: free
    databaseName: prajasetu
    user: prajasetu

services:
  - type: web
    name: praja-setu-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    # Track the default branch and redeploy automatically on every push to it,
    # so code merged to main always reaches production without a manual deploy.
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: WEB_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      # Internal connection string of the blueprint's Postgres (see `databases:`
      # at the top). Nothing to paste — Render fills this in automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: praja-setu-db
          property: connectionString
      # Pilot demo has no real SMS gateway — surface the generated OTP in the API
      # response so the citizen sign-in screen can show "Demo OTP: ……". Set to
      # "false" once a real SMS provider is wired up.
      - key: EXPOSE_MOCK_OTP
        value: "true"
      # Real AI analysis (root cause + pro suggestions). Add your Anthropic key in
      # the Render dashboard to switch from the built-in heuristic to live Claude.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5-20251001"
      # Sarvam AI speech-to-text (https://dashboard.sarvam.ai): detects the
      # SPOKEN language from the audio and returns the transcript in the native
      # script. Paste your key (sk_…) in the Render dashboard — without it the
      # app falls back to on-device browser speech recognition.
      - key: SARVAM_API_KEY
        sync: false

  - type: web
    name: praja-setu-web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    plan: free
    # Track the default branch and redeploy automatically on every push to it,
    # so UI/design changes merged to main always reach production.
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE
        value: "/api"
      # Resolved by Render to the API service's actual public URL. A hardcoded
      # "https://praja-setu-api.onrender.com" breaks when that subdomain is
      # already taken globally and Render suffixes the name (e.g.
      # praja-setu-api-lbrh.onrender.com) — fromService always tracks the real
      # URL. The web server proxies /api/* here.
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: praja-setu-api
          envVarKey: RENDER_EXTERNAL_URL
